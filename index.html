<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cort's Sticky Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='5' fill='%23ffd45c'/%3E%3Cpath d='M9 13h14M9 19h9' stroke='%234a3a5a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Patrick+Hand&display=swap');
:root{--ink:#453c54;--muted:#786f83;--paper:#fffdf8;--line:#eadfd2;--pink:#ffb8c7;--yellow:#ffe078;--blue:#b9e7f4;--mint:#bfe8d0;--lav:#d9c6ff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'DM Sans',sans-serif;background:#f6d6dd;overflow:hidden}button,input,textarea,select{font:inherit;color:inherit}button{border:0;cursor:pointer}.app{height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#f8d9df,#d8eff2 60%,#fef2c8)}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:rgba(255,253,248,.87);border-bottom:1px solid #fff;backdrop-filter:blur(12px);z-index:3}.brand{display:flex;align-items:center;gap:13px}.logo{font-size:30px}.brand h1{font-family:Fraunces,serif;font-size:23px;margin:0}.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.pill{padding:10px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;box-shadow:0 2px 0 #e6d6cc}.primary{background:#4e4264;color:#fff;border-color:#4e4264}.board-wrap{position:relative;flex:1;overflow:hidden}.board{position:absolute;inset:-30px;background-color:#fffdf8;background-image:radial-gradient(#eadfd2 1px,transparent 1px),linear-gradient(90deg,rgba(255,184,199,.10) 1px,transparent 1px),linear-gradient(rgba(255,184,199,.10) 1px,transparent 1px);background-size:20px 20px,80px 80px,80px 80px;transform-origin:0 0}.board:before{content:'CORT\A 2026 • PHASE TWO';white-space:pre;position:absolute;left:40px;top:34px;font-family:Fraunces,serif;font-size:12px;line-height:1.5;letter-spacing:2px;color:#c4b6ae}.note{position:absolute;width:235px;min-height:174px;padding:19px 18px 16px;border-radius:4px 4px 18px 4px;box-shadow:0 12px 22px rgba(86,61,69,.14);transform:rotate(var(--r));transition:box-shadow .2s,transform .2s;user-select:none}.note:hover{box-shadow:0 18px 28px rgba(86,61,69,.22);transform:rotate(0deg) scale(1.025);z-index:5}.note:after{content:'';position:absolute;right:0;bottom:0;border-style:solid;border-width:0 0 22px 22px;border-color:transparent transparent rgba(255,255,255,.42) transparent}.note.yellow{background:var(--yellow)}.note.pink{background:var(--pink)}.note.blue{background:var(--blue)}.note.mint{background:var(--mint)}.note.lav{background:var(--lav)}.grab{font-size:16px;cursor:grab;opacity:.5}.note h3{font-family:Fraunces,serif;font-size:19px;line-height:1.12;margin:10px 0 8px}.note p{font-family:'Patrick Hand',cursive;font-size:18px;line-height:1.18;margin:0 0 16px}.note .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:#62576a}.check{display:flex;gap:6px;align-items:center}.check input{accent-color:#4e4264}.stamp{font-size:23px}.note .del{background:transparent;font-size:15px;opacity:.45}.tools{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:22px;background:rgba(255,253,248,.92);box-shadow:0 8px 30px #bcaea966;border:1px solid white;z-index:8}.tools button{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:18px}.tools button:hover{background:#f4ecff}.zoom{position:absolute;right:22px;bottom:22px;display:flex;gap:4px;padding:5px;background:#fff;border-radius:17px;border:1px solid var(--line);z-index:8}.zoom button{background:transparent;width:30px;height:27px}.legend{position:absolute;right:24px;top:24px;background:rgba(255,253,248,.86);padding:11px 14px;border-radius:14px;font-size:12px;color:var(--muted);z-index:2}.legend b{color:var(--ink)}.dialog{position:fixed;inset:0;background:#40384a66;display:none;place-items:center;z-index:20}.dialog.open{display:grid}.modal{width:min(440px,calc(100vw - 34px));background:var(--paper);padding:24px;border-radius:22px;box-shadow:0 25px 70px #40384a55}.modal h2{font-family:Fraunces,serif;margin:0 0 16px}.modal input,.modal textarea,.modal select{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0 12px;background:#fff}.modal textarea{min-height:100px;resize:vertical}.row{display:flex;gap:8px;justify-content:flex-end}.hint{font-size:12px;color:var(--muted);line-height:1.4}@media(max-width:650px){header{padding:0 14px}.brand p{display:none}.brand h1{font-size:18px}.actions .pill:first-child{display:none}.note{width:205px}.legend{display:none}}
</style></head>
<body><div class="app"><header><div class="brand"><span class="logo">✦</span><div><h1>Cort's Sticky Board</h1><p>little ideas, held gently</p></div></div><div class="actions"><button class="pill" id="undo">↶ Undo</button><button class="pill primary" id="add">＋ New note</button></div></header><main class="board-wrap"><div class="board" id="board"></div><div class="legend"><b>Phase two · Oct–Dec 2026</b><br>Move freely; no deadlines implied</div><div class="tools"><button data-stamp="✦">✦</button><button data-stamp="♡">♡</button><button data-stamp="☼">☼</button><button data-stamp="☁">☁</button><button data-stamp="☕">☕</button><button data-stamp="✎">✎</button></div><div class="zoom"><button id="minus">−</button><span id="zoomLabel">100%</span><button id="plus">＋</button></div></main></div>
<div class="dialog" id="dialog"><form class="modal" id="form"><h2>Add a little note</h2><input id="title" placeholder="A short title" required><textarea id="body" placeholder="What's on your mind?"></textarea><select id="color"><option value="yellow">Sunshine</option><option value="pink">Blossom</option><option value="blue">Sky</option><option value="mint">Mint</option><option value="lav">Lavender</option></select><div class="row"><button type="button" class="pill" id="cancel">Cancel</button><button class="pill primary">Pin it</button></div></form></div>
<script>
const seed=[['Sketch the next idea','Leave room for the thought to become clearer.','pink','✦'],['Gather loose threads','Collect the small pieces that belong together.','blue','♡'],['Make the first pass','A gentle starting point is still progress.','yellow','✎'],['Stabilize the workflow','Smooth out the rough edges in the current process.','lav','☼'],['Creative direction','Keep the human point of view close to the work.','mint','☁'],['Try a small experiment','Test one useful change and notice what happens.','blue','☼'],['Review the open loop','Choose the next concrete action when ready.','pink','✦'],['Define the next milestone','Keep direction open while balancing craft and vision.','yellow','♡'],['End-of-year tidy-up','A low-priority cleanup note for later.','lav','☕']];
let notes=[];let trash=[];let scale=1;const board=document.querySelector('#board');
async function api(path,opts={}){let r=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...opts});if(!r.ok){if(r.status===409)alert('This note changed elsewhere. Refreshing keeps the newest version.');throw Error(await r.text())}return r.status===204?null:r.json()}
async function load(){notes=await api('/notes');if(!notes.length){for(const [i,n] of seed.entries())await api('/notes',{method:'POST',body:JSON.stringify({title:n[0],body:n[1],color:n[2],stamp:n[3],x:70+(i%4)*255,y:90+Math.floor(i/4)*220})});notes=await api('/notes')}render()}
async function update(n,patch){try{let fresh=await api('/notes/'+n.id,{method:'PATCH',body:JSON.stringify({...patch,version:n.version})});Object.assign(n,fresh);return true}catch(e){notes=await api('/notes');render();return false}}
function render(){board.querySelectorAll('.note').forEach(e=>e.remove());notes.forEach(n=>{let el=document.createElement('article');el.className='note '+n.color;el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.setProperty('--r',((n.id.charCodeAt(0)%7)-3)+'deg');el.innerHTML=`<div class="grab">⠿ <button class="del" aria-label="Move to trash">⋯</button></div><h3 contenteditable="true">${esc(n.title)}</h3><p contenteditable="true">${esc(n.body)}</p><div class="meta"><label class="check"><input type="checkbox" ${n.done?'checked':''}> ${n.done?'Done':'Open'}</label><span class="stamp">${n.stamp}</span></div>`;board.append(el);let drag=null;el.addEventListener('pointerdown',e=>{if(e.target.closest('[contenteditable],input,button'))return;drag={x:e.clientX,y:e.clientY,ox:n.x,oy:n.y};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!drag)return;n.x=drag.ox+(e.clientX-drag.x)/scale;n.y=drag.oy+(e.clientY-drag.y)/scale;el.style.left=n.x+'px';el.style.top=n.y+'px'});el.addEventListener('pointerup',()=>{if(drag){drag=null;update(n,{x:n.x,y:n.y})}});el.querySelector('h3').addEventListener('blur',e=>update(n,{title:e.target.innerText}));el.querySelector('p').addEventListener('blur',e=>update(n,{body:e.target.innerText}));el.querySelector('input').addEventListener('change',e=>{update(n,{done:e.target.checked}).then(render)});el.querySelector('.del').addEventListener('click',async()=>{trash.push(n);await api('/notes/'+n.id,{method:'DELETE'});notes=notes.filter(x=>x.id!==n.id);render()})})}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelector('#add').onclick=()=>document.querySelector('#dialog').classList.add('open');document.querySelector('#cancel').onclick=()=>document.querySelector('#dialog').classList.remove('open');document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let n=await api('/notes',{method:'POST',body:JSON.stringify({title:title.value,body:body.value,color:color.value,stamp:'✦',x:100+Math.random()*300,y:120+Math.random()*250})});notes.push(n);render();e.target.reset();document.querySelector('#dialog').classList.remove('open')};document.querySelector('#undo').onclick=async()=>{if(trash.length){let old=trash.pop();let n=await api('/notes',{method:'POST',body:JSON.stringify({...old,id:crypto.randomUUID(),version:1})});notes.push(n);render()}};document.querySelectorAll('[data-stamp]').forEach(b=>b.onclick=()=>{let open=notes.find(n=>!n.done);if(open)update(open,{stamp:b.dataset.stamp}).then(render)});function setZoom(v){scale=Math.max(.7,Math.min(1.35,v));board.style.transform=`scale(${scale})`;zoomLabel.textContent=Math.round(scale*100)+'%'}minus.onclick=()=>setZoom(scale-.1);plus.onclick=()=>setZoom(scale+.1);load();
</script></body></html>
